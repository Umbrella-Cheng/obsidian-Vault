<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300"><rect width="800" height="300" fill="white"/><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#263445}.t{font-size:22px;font-weight:700}.s{font-size:16px}.m{font-size:18px}.small{font-size:14px}</style><text class="t" x="30" y="35">多元设元：先建立关系，再消元求解</text><g stroke="#69849d" stroke-width="2" fill="none"><path d="M172 110 H310 M172 172 H310 M172 234 H310 M485 172 H630"/><path d="M310 110 l-10 -5 v10 z M310 172 l-10 -5 v10 z M310 234 l-10 -5 v10 z M630 172 l-10 -5 v10 z"/></g><g><rect x="30" y="80" width="142" height="55" rx="9" fill="#e0edf9" stroke="#5e8ab3"/><rect x="30" y="145" width="142" height="55" rx="9" fill="#e0edf9" stroke="#5e8ab3"/><rect x="30" y="210" width="142" height="55" rx="9" fill="#e0edf9" stroke="#5e8ab3"/><text class="m" x="101" y="113" text-anchor="middle">甲：x</text><text class="m" x="101" y="178" text-anchor="middle">乙：y</text><text class="m" x="101" y="243" text-anchor="middle">丙：z</text><rect x="310" y="90" width="175" height="160" rx="12" fill="#e5f3ea" stroke="#51926c"/><text class="m" x="397" y="123" text-anchor="middle">x+y+z=32</text><text class="m" x="397" y="168" text-anchor="middle">x=y+z</text><text class="m" x="397" y="213" text-anchor="middle">y−z=4</text><rect x="630" y="120" width="145" height="105" rx="12" fill="#fff0d6" stroke="#bf8b38"/><text class="m" x="702" y="153" text-anchor="middle">x=16</text><text class="m" x="702" y="182" text-anchor="middle">y=10</text><text class="m" x="702" y="211" text-anchor="middle">z=6</text></g><text class="small" x="400" y="287" text-anchor="middle">变量数量可以增加；利用约束关系消元后得到所求量</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 0 800 278"><rect width="800" height="278" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#263445"><text x="35" y="36" font-size="21" font-weight="bold">基本不等式：定和求积最大值</text><text x="35" y="67" font-size="17">a+b=s，a、b≥0，积 ab=a(s−a)</text><path d="M90 205 H720 l-10 -5 m10 5 l-10 5 M90 205 V77 l-5 10 m5 -10 l5 10" stroke="#64748b" stroke-width="2" fill="none"/><path d="M105 205 Q405 -1 705 205" fill="none" stroke="#2677b8" stroke-width="3"/><path d="M405 102 V205" stroke="#16825a" stroke-dasharray="5 5" stroke-width="2"/><circle cx="405" cy="102" r="6" fill="#16825a"/><g font-size="17"><text x="420" y="99">a=b=</text><text x="478" y="89">s</text><path d="M474 96 H492" stroke="#263445" stroke-width="1.5"/><text x="478" y="113">2</text><text x="420" y="143">最大积：</text><text x="498" y="133">s²</text><path d="M495 140 H521" stroke="#263445" stroke-width="1.5"/><text x="502" y="157">4</text><text x="729" y="212">a</text><text x="80" y="231">0</text><text x="397" y="227">s</text><path d="M390 233 H412" stroke="#263445" stroke-width="1.5"/><text x="397" y="250">2</text><text x="698" y="231">s</text><text x="58" y="80">ab</text></g><text x="400" y="261" font-size="16" text-anchor="middle">抛物线顶点对应 a=b，此时乘积取得最大值</text></g></svg>
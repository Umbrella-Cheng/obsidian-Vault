<svg xmlns="http://www.w3.org/2000/svg" width="800" height="278" viewBox="0 0 800 278"><rect width="800" height="278" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#263445"><text x="35" y="36" font-size="19" font-weight="bold">AM–GM: fixed sum, maximum product</text><text x="35" y="66" font-size="16">a + b = s,  a,b ≥ 0</text><path d="M90 205 H720 M405 225 V85" stroke="#64748b" stroke-width="2"/><path d="M720 205 l-10 -5 v10 z" fill="#64748b"/><path d="M405 85 l-5 10 h10 z" fill="#64748b"/><path d="M105 204 Q405 -15 705 204" fill="none" stroke="#2677b8" stroke-width="3"/><path d="M405 102 V205" stroke="#16825a" stroke-dasharray="5 5" stroke-width="2"/><circle cx="405" cy="102" r="6" fill="#16825a"/><g font-size="17"><text x="420" y="100">a = b = s/2</text><text x="420" y="124">ab = s²/4</text><text x="690" y="230">a</text><text x="95" y="230">0</text><text x="395" y="230">s/2</text><text x="695" y="195">s</text><text x="420" y="83">ab</text></g><text x="405" y="259" font-size="15" text-anchor="middle">The product a(s − a) reaches its maximum at the vertex.</text></g></svg>
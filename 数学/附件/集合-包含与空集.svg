<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"><rect width="760" height="320" fill="white"/><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#263445}.t{font-size:22px;font-weight:700}.s{font-size:16px}.m{font-size:18px}.small{font-size:14px}</style><text class="t" x="30" y="35">集合的包含关系与空集</text><rect x="70" y="65" width="620" height="210" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text class="m" x="91" y="92">全集 U</text><ellipse cx="305" cy="170" rx="155" ry="83" fill="#d7eafc" stroke="#2475ad" stroke-width="2"/><ellipse cx="305" cy="170" rx="76" ry="48" fill="#bdebd4" stroke="#19805a" stroke-width="2"/><text class="m" x="302" y="177" text-anchor="middle">A</text><text class="m" x="412" y="175">B</text><text class="s" x="530" y="170">A ⊆ B ⊆ U</text><text class="s" x="530" y="197">∅ ⊆ A</text><text class="small" x="380" y="305" text-anchor="middle">空集是任意集合的子集；圆形仅用于表示包含关系</text></svg>
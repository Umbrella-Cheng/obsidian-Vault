<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270"><rect width="800" height="270" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#263445"><text x="40" y="34" font-size="21" font-weight="bold">穿根法：零点重数与符号变化</text><text x="40" y="63" font-size="17">P(x) = (x−1)²(x+2)(3x−1)</text><rect x="76" y="107" width="171" height="29" fill="#d7f2e4"/><rect x="249" y="107" width="200" height="29" fill="#fce4e3"/><rect x="451" y="107" width="125" height="29" fill="#d7f2e4"/><rect x="578" y="107" width="165" height="29" fill="#d7f2e4"/><path d="M75 145 H745 l-10 -5 m10 5 l-10 5" stroke="#566578" fill="none" stroke-width="2"/><g font-size="20" text-anchor="middle"><text x="160" y="129" fill="#147d50">＋</text><text x="347" y="129" fill="#bc3535">−</text><text x="514" y="129" fill="#147d50">＋</text><text x="663" y="129" fill="#147d50">＋</text></g><g stroke="#334155" stroke-width="2"><path d="M248 133 v27 M450 133 v27 M577 133 v27"/></g><g fill="#fff" stroke="#334155" stroke-width="2"><circle cx="248" cy="145" r="5"/><circle cx="450" cy="145" r="5"/><circle cx="577" cy="145" r="5"/></g><g font-size="17" text-anchor="middle"><text x="248" y="181">−2</text><text x="450" y="181">1/3</text><text x="577" y="181">1</text><text x="248" y="211">一重根</text><text x="450" y="211">一重根</text><text x="577" y="211">二重根</text><text x="400" y="251">经过奇数重根时变号；经过偶数重根时符号不变</text></g></g></svg>
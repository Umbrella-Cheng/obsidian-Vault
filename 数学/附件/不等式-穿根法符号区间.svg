<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270"><rect width="800" height="270" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#263445"><text x="40" y="34" font-size="19" font-weight="bold">Polynomial sign intervals</text><text x="40" y="61" font-size="15">P(x) = (x-1)^2(x+2)(3x-1)</text><path d="M75 145 H745" stroke="#566578" stroke-width="2"/><path d="M745 145 l-10 -5 v10 z" fill="#566578"/><rect x="77" y="108" width="170" height="28" fill="#d7f2e4"/><rect x="249" y="108" width="200" height="28" fill="#fce4e3"/><rect x="451" y="108" width="125" height="28" fill="#d7f2e4"/><rect x="578" y="108" width="165" height="28" fill="#d7f2e4"/><g stroke="#334155" stroke-width="2"><path d="M248 132 v27 M450 132 v27 M577 132 v27"/></g><g font-size="19" text-anchor="middle"><text x="160" y="129" fill="#147d50">+</text><text x="347" y="129" fill="#bc3535">−</text><text x="514" y="129" fill="#147d50">+</text><text x="663" y="129" fill="#147d50">+</text><text x="248" y="181">−2</text><text x="450" y="181">1/3</text><text x="577" y="181">1</text></g><g fill="#fff" stroke="#334155" stroke-width="2"><circle cx="248" cy="145" r="5"/><circle cx="450" cy="145" r="5"/><circle cx="577" cy="145" r="5"/></g><g font-size="15" text-anchor="middle"><text x="248" y="211">odd root</text><text x="450" y="211">odd root</text><text x="577" y="211">even root</text><text x="400" y="251">Sign changes at odd multiplicity; stays at even multiplicity.</text></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350"><rect width="800" height="350" fill="white"/><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#263445}.t{font-size:22px;font-weight:700}.s{font-size:16px}.m{font-size:18px}.small{font-size:14px}</style><text class="t" x="30" y="35">配方法的几何意义（x≥0，b≥0）</text><text class="s" x="30" y="65">将 x²+bx 分解成正方形与两块矩形，再补上缺少的小正方形</text><rect x="110" y="112" width="190" height="190" fill="#cde6fa" stroke="#397ba8" stroke-width="2"/><rect x="300" y="112" width="65" height="190" fill="#ccead9" stroke="#397b60" stroke-width="2"/><rect x="110" y="302" width="190" height="0" fill="none"/><text class="m" x="205" y="210" text-anchor="middle">x²</text><text class="s" x="332" y="210" text-anchor="middle">bx</text><path d="M110 105 H300 M110 309 H300" stroke="#64748b"/><text class="s" x="205" y="97" text-anchor="middle">x</text><text class="s" x="332" y="97" text-anchor="middle">b</text><path d="M430 190 H500" stroke="#64748b" stroke-width="2"/><path d="M500 190 l-10 -6 v12 z" fill="#64748b"/><rect x="545" y="110" width="175" height="175" fill="#cde6fa" stroke="#397ba8" stroke-width="2"/><rect x="720" y="110" width="50" height="175" fill="#ccead9" stroke="#397b60" stroke-width="2"/><rect x="545" y="285" width="175" height="50" fill="#ccead9" stroke="#397b60" stroke-width="2"/><rect x="720" y="285" width="50" height="50" fill="#ffe5b9" stroke="#bd8132" stroke-width="2"/><text class="s" x="632" y="202" text-anchor="middle">x²</text><text class="small" x="745" y="202" text-anchor="middle">bx/2</text><text class="small" x="632" y="314" text-anchor="middle">bx/2</text><text class="small" x="745" y="311" text-anchor="middle">b²/4</text><text class="small" x="380" y="336" text-anchor="middle">x²+bx+b²/4 = (x+b/2)²</text></svg>
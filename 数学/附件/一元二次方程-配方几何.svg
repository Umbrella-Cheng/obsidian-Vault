<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390"><rect width="900" height="390" fill="white"/><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#263445}.t{font-size:22px;font-weight:700}.s{font-size:16px}.m{font-size:18px}.small{font-size:14px}</style><text class="t" x="25" y="34">配方法的几何意义（x≥0，b≥0）</text><text class="s" x="25" y="61">把面积 bx 平分为两块矩形，再补上一个小正方形</text><rect x="60" y="110" width="170" height="170" fill="#cde6fa" stroke="#397ba8" stroke-width="2"/><rect x="230" y="110" width="100" height="170" fill="#ccead9" stroke="#397b60" stroke-width="2"/><path d="M280 110 V280" stroke="#397b60" stroke-dasharray="5 4"/><text class="m" x="145" y="199" text-anchor="middle">x²</text><text class="s" x="280" y="193" text-anchor="middle">bx</text><text class="s" x="145" y="101" text-anchor="middle">x</text><text class="s" x="280" y="101" text-anchor="middle">b</text><path d="M355 196 H425 l-10 -6 m10 6 l-10 6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="470" y="110" width="170" height="170" fill="#cde6fa" stroke="#397ba8" stroke-width="2"/><rect x="640" y="110" width="50" height="170" fill="#ccead9" stroke="#397b60" stroke-width="2"/><rect x="470" y="280" width="170" height="50" fill="#ccead9" stroke="#397b60" stroke-width="2"/><rect x="640" y="280" width="50" height="50" fill="#ffe5b9" stroke="#bd8132" stroke-width="2"/><text class="m" x="555" y="203" text-anchor="middle">x²</text><g font-size="14" text-anchor="middle"><text x="665" y="185">bx</text><path d="M644 193 H686" stroke="#263445" stroke-width="1.5"/><text x="665" y="210">2</text></g><g font-size="14" text-anchor="middle"><text x="555" y="297">bx</text><path d="M534 305 H576" stroke="#263445" stroke-width="1.5"/><text x="555" y="322">2</text></g><g font-size="14" text-anchor="middle"><text x="665" y="294">b²</text><path d="M644 302 H686" stroke="#263445" stroke-width="1.5"/><text x="665" y="319">4</text></g><text class="s" x="730" y="145">补充面积</text><g font-size="18" text-anchor="middle"><text x="785" y="175">b²</text><path d="M764 183 H806" stroke="#263445" stroke-width="1.5"/><text x="785" y="200">4</text></g><text class="s" x="25" y="369">x² + bx +</text><g font-size="15" text-anchor="middle"><text x="156" y="346">b²</text><path d="M135 354 H177" stroke="#263445" stroke-width="1.5"/><text x="156" y="371">4</text></g><text class="s" x="192" y="369">= (x +</text><g font-size="15" text-anchor="middle"><text x="283" y="346">b</text><path d="M262 354 H304" stroke="#263445" stroke-width="1.5"/><text x="283" y="371">2</text></g><text class="s" x="317" y="369">)²</text><text class="small" x="710" y="367">示意图不按比例绘制</text></svg>
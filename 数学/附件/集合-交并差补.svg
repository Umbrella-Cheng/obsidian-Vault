<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" fill="white"/><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;font-size:18px;fill:#263445}</style><text x="30" y="33" style="font-size:24px;font-weight:700">集合的交、并、差与补</text><g transform="translate(20 55)"><defs><clipPath id="a0"><circle cx="150" cy="115" r="73"/></clipPath><mask id="cut0"><rect width="360" height="240" fill="white"/><circle cx="220" cy="115" r="73" fill="black"/></mask><mask id="cutA0"><rect width="360" height="240" fill="white"/><circle cx="150" cy="115" r="73" fill="black"/></mask></defs><rect x="10" y="20" width="340" height="210" rx="6" fill="#f3f6fa"/><g clip-path="url(#a0)"><circle cx="220" cy="115" r="73" fill="#67b89c"/></g><rect x="10" y="20" width="340" height="210" rx="6" fill="none" stroke="#65758b"/><circle cx="150" cy="115" r="73" fill="none" stroke="#284c79" stroke-width="2"/><circle cx="220" cy="115" r="73" fill="none" stroke="#284c79" stroke-width="2"/><text x="25" y="43">U</text><text x="111" y="118">A</text><text x="250" y="118">B</text><text x="180" y="260" text-anchor="middle">交集 A ∩ B</text></g><g transform="translate(400 55)"><defs><clipPath id="a1"><circle cx="150" cy="115" r="73"/></clipPath><mask id="cut1"><rect width="360" height="240" fill="white"/><circle cx="220" cy="115" r="73" fill="black"/></mask><mask id="cutA1"><rect width="360" height="240" fill="white"/><circle cx="150" cy="115" r="73" fill="black"/></mask></defs><rect x="10" y="20" width="340" height="210" rx="6" fill="#f3f6fa"/><circle cx="150" cy="115" r="73" fill="#67b89c"/><circle cx="220" cy="115" r="73" fill="#67b89c"/><rect x="10" y="20" width="340" height="210" rx="6" fill="none" stroke="#65758b"/><circle cx="150" cy="115" r="73" fill="none" stroke="#284c79" stroke-width="2"/><circle cx="220" cy="115" r="73" fill="none" stroke="#284c79" stroke-width="2"/><text x="25" y="43">U</text><text x="111" y="1
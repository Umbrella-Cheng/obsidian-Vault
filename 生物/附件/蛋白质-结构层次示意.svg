<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380"><rect width="940" height="380" rx="18" fill="#f8fafc"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#243347}.title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:15px;fill:#53657a}</style><text x="35" y="45" class="title">蛋白质结构层次</text><text x="35" y="74" class="small">一级结构描述序列；二级、三级及四级结构描述不同层次的空间组织</text><rect x="25" y="104" width="210" height="215" rx="16" fill="#e6f0f9"/><text x="130" y="141" class="label" text-anchor="middle">一级结构</text><text x="130" y="291" class="small" text-anchor="middle">氨基酸序列</text><path d="M 238 211 h 12 m -6 -6 l 6 6 -6 6" stroke="#8097a9" stroke-width="2" fill="none"/><circle cx="60" cy="208" r="11" fill="#488db9"/><path d="M 71 208 h 6" stroke="#7c91a5" stroke-width="3"/><circle cx="88" cy="208" r="11" fill="#dfa14f"/><path d="M 99 208 h 6" stroke="#7c91a5" stroke-width="3"/><circle cx="116" cy="208" r="11" fill="#78a88c"/><path d="M 127 208 h 6" stroke="#7c91a5" stroke-width="3"/><circle cx="144" cy="208" r="11" fill="#488db9"/><path d="M 155 208 h 6" stroke="#7c91a5" stroke-width="3"/><circle cx="172" cy="208" r="11" fill="#dfa14f"/><path d="M 183 208 h 6" stroke="#7c91a5" stroke-width="3"/><circle cx="200" cy="208" r="11" fill="#78a88c"/><rect x="255" y="104" width="210" height="215" rx="16" fill="#e9f3ec"/><text x="360" y="141" class="label" text-anchor="middle">二级结构</text><text x="360" y="291" class="small" text-anchor="middle">局部规则构象</text><path d="M 468 211 h 12 m -6 -6 l 6 6 -6 6" stroke="#8097a9" stroke-width="2" fill="none"/><path d="M 291 212 C 315 150, 339 275, 363 212 S 411 150, 435 212" stroke="#488db9" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="485" y="104" width="210" height="215" rx="16" fill="#e6f0f9"/><text x="590" y="141" class="label" text-anchor="middle">三级结构</text><text x="590" y="291" class="small" text-anchor="middle">单条多肽的整体折叠</text><path d="M 698 211 h 12 m -6 -6 l 6 6 -6 6" stroke="#8097a9" stroke-width="2" fill="none"/><path d="M 530 231 C 490 160, 595 158, 630 207 S 555 260, 550 195 S 665 156, 645 246 S 555 272, 530 231" stroke="#5d9f85" stroke-width="9" fill="none" stroke-linecap="round"/><rect x="715" y="104" width="210" height="215" rx="16" fill="#e9f3ec"/><text x="820" y="141" class="label" text-anchor="middle">四级结构</text><text x="820" y="291" class="small" text-anchor="middle">多个亚基的装配</text><ellipse cx="780" cy="195" rx="44" ry="30" fill="#4e8fba" opacity=".85" stroke="white" stroke-width="3"/><ellipse cx="850" cy="195" rx="44" ry="30" fill="#e1a456" opacity=".85" stroke="white" stroke-width="3"/><ellipse cx="815" cy="238" rx="44" ry="30" fill="#74aa8c" opacity=".85" stroke="white" stroke-width="3"/><text x="35" y="352" class="small">并非所有蛋白质都有四级结构；部分蛋白质含无序区域，空间结构也可能随环境与结合状态改变。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><rect width="960" height="470" rx="18" fill="#f8fafc"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#23364b}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#53677a}</style><text x="34" y="43" class="title">氨基酸连接与多肽形成</text><text x="34" y="72" class="small">示意以两种氨基酸为例；R₁、R₂ 表示不同侧链</text><rect x="32" y="98" width="420" height="130" rx="14" fill="#e7f2fa"/><rect x="510" y="98" width="420" height="130" rx="14" fill="#e7f2fa"/><text x="50" y="130" class="label">氨基酸 1</text><text x="530" y="130" class="label">氨基酸 2</text><text x="55" y="182" font-size="23">H₂N—CH—COOH</text><text x="174" y="210" class="small">│</text><text x="172" y="226" class="small">R₁</text><text x="535" y="182" font-size="23">H₂N—CH—COOH</text><text x="654" y="210" class="small">│</text><text x="652" y="226" class="small">R₂</text><path d="M 474 171 H 501" stroke="#638ea9" stroke-width="3"/><path d="M 494 163 L 502 171 L 494 179" stroke="#638ea9" fill="none" stroke-width="3"/><text x="480" y="260" text-anchor="middle" class="label">脱水缩合：形成肽键并释放水</text><path d="M 480 274 V 305" stroke="#638ea9" stroke-width="3"/><path d="M 472 296 L 480 306 L 488 296" stroke="#638ea9" fill="none" stroke-width="3"/><rect x="85" y="320" width="790" height="92" rx="14" fill="#e7f3ec"/><text x="108" y="351" class="label">二肽</text><text x="235" y="357" font-size="24">H₂N—CH—C(=O)—NH—CH—COOH</text><text x="324" y="387" class="small">R₁</text><text x="606" y="387" class="small">R₂</text><path d="M 476 366 H 544" stroke="#d69c4e" stroke-width="4"/><text x="510" y="402" text-anchor="middle" class="small">肽键区域</text><text x="35" y="450" class="small">图示强调连接关系，具体键角及侧链位置未按分子几何比例绘制。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="990" height="510" viewBox="0 0 990 510"><rect width="990" height="510" rx="18" fill="#f8fafc"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#243347}.title{font-size:25px;font-weight:700}.sub{font-size:16px;fill:#52657b}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#52657b}</style><text x="35" y="42" class="title">生命系统的结构层次</text><text x="35" y="70" class="sub">由小到大：细胞 → 组织 → 器官 →（系统）→ 个体 → 种群 → 群落 → 生态系统 → 生物圈</text><rect x="40" y="136" width="88" height="68" rx="12" fill="#e1eff8" stroke="#8ab4d4"/><text x="84" y="177" font-size="18" text-anchor="middle" font-weight="600">细胞</text><path d="M 130 170 h 10" stroke="#7893a7" stroke-width="2.5"/><path d="M 138 165 l 7 5 -7 5" fill="none" stroke="#7893a7" stroke-width="2"/><rect x="145" y="136" width="88" height="68" rx="12" fill="#e1eff8" stroke="#8ab4d4"/><text x="189" y="177" font-size="18" text-anchor="middle" font-weight="600">组织</text><path d="M 235 170 h 10" stroke="#7893a7" stroke-width="2.5"/><path d="M 243 165 l 7 5 -7 5" fill="none" stroke="#7893a7" stroke-width="2"/><rect x="250" y="136" width="88" height="68" rx="12" fill="#e1eff8" stroke="#8ab4d4"/><text x="294" y="177" font-size="18" text-anchor="middle" font-weight="600">器官</text><path d="M 340 170 h 10" stroke="#7893a7" stroke-width="2.5"/><path d="M 348 165 l 7 5 -7 5" fill="none" stroke="#7893a7" stroke-width="2"/><rect x="355" y="136" width="88" height="68" rx="12" fill="#fef0d7" stroke="#d6a34e"/><text x="399" y="177" font-size="18" text-anchor="middle" font-weight="600">系统</text><path d="M 445 170 h 10" stroke="#7893a7" stroke-width="2.5"/><path d="M 453 165 l 7 5 -7 5" fill="none" stroke="#7893a7" stroke-width="2"/><rect x="460" y="136" width="88" height="68" rx="12" fill="#e1eff8" stroke="#8ab4d4"/><text x="504" y="177" font-size="18" text-anchor="middle" font-weight="600">个体</text><path d="M 550 170 h 10" stroke="#7893a7" stroke-width="2.5"/><path d="M 558 165 l 7 5 -7 5" fill="none" stroke="#7893a7" stroke-width="2"/><rect x="565" y="136" width="88" height="68" rx="12" fill="#e1eff8" stroke="#8ab4d4"/><text x="609" y="177" font-size="18" text-anchor="middle" font-weight="600">种群</text><path d="M 655 170 h 10" stroke="#7893a7" stroke-width="2.5"/><path d="M 663 165 l 7 5 -7 5" fill="none" stroke="#7893a7" stroke-width="2"/><rect x="670" y="136" width="88" height="68" rx="12" fill="#e1eff8" stroke="#8ab4d4"/><text x="714" y="177" font-size="18" text-anchor="middle" font-weight="600">群落</text><path d="M 760 170 h 10" stroke="#7893a7" stroke-width="2.5"/><path d="M 768 165 l 7 5 -7 5" fill="none" stroke="#7893a7" stroke-width="2"/><rect x="775" y="136" width="100" height="68" rx="12" fill="#e1eff8" stroke="#8ab4d4"/><text x="825" y="177" font-size="16" text-anchor="middle" font-weight="600">生态系统</text><path d="M 877 170 h -2" stroke="#7893a7" stroke-width="2.5"/><path d="M 873 165 l 7 5 -7 5" fill="none" stroke="#7893a7" stroke-width="2"/><rect x="880" y="136" width="88" height="68" rx="12" fill="#e1eff8" stroke="#8ab4d4"/><text x="924" y="177" font-size="18" text-anchor="middle" font-weight="600">生物圈</text><rect x="38" y="250" width="910" height="63" rx="12" fill="#eaf5ef"/><text x="58" y="276" class="label">高等动物</text><text x="225" y="277" class="sub">细胞 → 组织 → 器官 → 系统 → 个体</text><text x="225" y="298" class="small">系统由多个器官协调组成</text><rect x="38" y="325" width="910" height="63" rx="12" fill="#fff2df"/><text x="58" y="352" class="label">绿色开花植物</text><text x="225" y="351" class="sub">细胞 → 组织 → 器官 → 个体</text><text x="225" y="373" class="small">高中常用层次划分中没有“系统”层次</text><rect x="38" y="400" width="910" height="63" rx="12" fill="#edf0fb"/><text x="58" y="438" class="label">单细胞生物</text><text x="225" y="437" class="sub">细胞 = 个体</text><text x="450" y="437" class="small">一个细胞完成个体的生命活动</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475"><rect width="1000" height="475" rx="18" fill="#f8fafc"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#243347}.title{font-size:25px;font-weight:700}.sub{font-size:16px;fill:#52657b}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#52657b}</style><text x="36" y="43" class="title">细胞学说的建立与修正</text><text x="36" y="70" class="sub">从显微观察到理论建立，再由细胞分裂证据完善理论</text><path d="M 80 238 H 922" stroke="#8ba5bb" stroke-width="5" stroke-linecap="round"/><circle cx="82" cy="238" r="11" fill="#4684b5" stroke="white" stroke-width="3"/><path d="M 82 238 V 215" stroke="#9bb1c4" stroke-width="2"/><rect x="14" y="115" width="152" height="110" rx="12" fill="#e7f2fa"/><text x="86" y="143" font-size="16" font-weight="700" text-anchor="middle">1665</text><text x="86" y="170" font-size="16" text-anchor="middle">胡克</text><text x="86" y="196" font-size="14" text-anchor="middle">命名细胞</text><circle cx="250" cy="238" r="11" fill="#4684b5" stroke="white" stroke-width="3"/><path d="M 250 238 V 260" stroke="#9bb1c4" stroke-width="2"/><rect x="178" y="290" width="152" height="110" rx="12" fill="#e7f2fa"/><text x="254" y="318" font-size="16" font-weight="700" text-anchor="middle">17世纪后期</text><text x="254" y="345" font-size="16" text-anchor="middle">列文虎克</text><text x="254" y="371" font-size="14" text-anchor="middle">观察微观生命</text><circle cx="418" cy="238" r="11" fill="#4684b5" stroke="white" stroke-width="3"/><path d="M 418 238 V 215" stroke="#9bb1c4" stroke-width="2"/><rect x="346" y="115" width="152" height="110" rx="12" fill="#e7f2fa"/><text x="422" y="143" font-size="16" font-weight="700" text-anchor="middle">1831</text><text x="422" y="170" font-size="16" text-anchor="middle">布朗</text><text x="422" y="196" font-size="14" text-anchor="middle">描述细胞核</text><circle cx="586" cy="238" r="11" fill="#d49b49" stroke="white" stroke-width="3"/><path d="M 586 238 V 260" stroke="#9bb1c4" stroke-width="2"/><rect x="514" y="290" width="152" height="110" rx="12" fill="#fff0d6"/><text x="590" y="318" font-size="16" font-weight="700" text-anchor="middle">1838—1839</text><text x="590" y="345" font-size="16" text-anchor="middle">施莱登、施旺</text><text x="590" y="371" font-size="14" text-anchor="middle">建立学说框架</text><circle cx="754" cy="238" r="11" fill="#5c9d85" stroke="white" stroke-width="3"/><path d="M 754 238 V 215" stroke="#9bb1c4" stroke-width="2"/><rect x="682" y="115" width="152" height="110" rx="12" fill="#e6f4ed"/><text x="758" y="143" font-size="13" font-weight="700" text-anchor="middle">19世纪40—50年代</text><text x="758" y="170" font-size="15" text-anchor="middle">耐格里、雷马克</text><text x="758" y="196" font-size="14" text-anchor="middle">提供细胞分裂证据</text><circle cx="922" cy="238" r="11" fill="#5c9d85" stroke="white" stroke-width="3"/><path d="M 922 238 V 260" stroke="#9bb1c4" stroke-width="2"/><rect x="850" y="290" width="152" height="110" rx="12" fill="#e6f4ed"/><text x="926" y="318" font-size="16" font-weight="700" text-anchor="middle">1855</text><text x="926" y="345" font-size="16" text-anchor="middle">魏尔肖</text><text x="926" y="371" font-size="14" text-anchor="middle">推广细胞来自细胞</text><text x="38" y="447" class="small">注：时间轴仅选取关键节点；学说形成与修正是多位研究者共同推进的过程。</text></svg>